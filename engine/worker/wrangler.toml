# The AREST successor Worker: the wasm core + worker.js routes.
# Build the wasm first:
#   cd ../rust
#   cargo build --release --target wasm32-unknown-unknown \
#     --no-default-features --features worker
#   wasm-bindgen --target web --out-dir ../worker \
#     target/wasm32-unknown-unknown/release/arest_core.wasm
name = "arest-worker"
main = "worker.js"
compatibility_date = "2026-07-01"

# the support site rides this worker (Samuel 2026-07-08: the first
# production consumer of the abstract UI at the edge)
routes = [
  { pattern = "support.auto.dev/*", zone_name = "auto.dev" }
]

# the store: either a KV binding holding the sidecar payload under
# the key "sidecar", or an inline var for small apps
# [[kv_namespaces]]
# binding = "STORE"
# id = "..."
# [vars]
# SIDECAR_JSON = "{...}"

# the log's KV mirror (worker-do-minimize, Samuel 2026-07-08: DOs are
# getting expensive — appends WRITE THROUGH here; SSE and boot READ
# here; the DO is touched only by appends, its irreducible
# single-writer commit role)
[[kv_namespaces]]
binding = "AREST_LOG"
id = "0cefc55f151b421e9773ef52a073f122"

[[durable_objects.bindings]]
name = "LOG"
class_name = "ArestLog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArestLog"]

# THE D1 ENDGAME (the whitepaper's Def. iso: ONE serialized append per
# app stream — D1's single-writer SQLite gives it with ZERO DOs; the
# DO's unique powers were unused): events(app, n, line), n minted by
# the atomic INSERT-with-subquery. The KV mirror stays the read path.
[[d1_databases]]
binding = "DB"
database_name = "arest-log"
database_id = "c8b1d12c-391b-49d0-a75c-83b0d738e88e"
