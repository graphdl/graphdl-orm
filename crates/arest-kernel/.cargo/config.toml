# crates/arest-kernel/.cargo/config.toml
#
# Default build for arest-kernel is UEFI x86_64 — the only kernel
# target after #380 deprecated the BIOS path (`x86_64-unknown-none` +
# rust-osdev `bootloader` Multiboot2 stage). UEFI requires nightly
# (see rust-toolchain.toml) for the `abi_x86_interrupt` feature.
#
# Override per-invocation with --target for the aarch64 / armv7
# UEFI arms or a host build:
#   cargo +nightly check --target aarch64-unknown-uefi
#   cargo +nightly check --target ./arest-kernel-armv7-uefi.json \
#       -Z build-std=core,alloc,compiler_builtins -Z unstable-options

[build]
target = "x86_64-unknown-uefi"

# `cargo t` runs the lib tests on the host target instead of UEFI
# (where std isn't linkable and the panic_handler in entry_uefi.rs
# would collide with std's). Mirror of the arest crate's `t` alias
# pattern. #582.
[alias]
t = "test --lib --target x86_64-pc-windows-msvc"
c = "check --lib --target x86_64-pc-windows-msvc"

# Force the portable (soft) backends of the RustCrypto stack on the
# UEFI x86_64 target. poly1305's AVX2/SSE backend fails to codegen for
# x86_64-unknown-uefi under the current nightly — `rustc-LLVM ERROR: Do
# not know how to split the result of this operator!` — because the
# wide-vector lowering can't be legalized for this target. The `soft`
# backend is scalar, so it sidesteps the bad codegen entirely; it is
# also the correct choice for a kernel that does not set up AVX state
# for save/restore. cpufeatures still picks soft at runtime when SIMD
# isn't available, so this only removes the un-buildable code path.
# chacha20 needs the same treatment: its AVX2 backend codegens fine as
# its own crate but triggers the split-codegen error once inlined into
# a consumer (arest-foundation, via chacha20poly1305's AEAD). Forcing
# its soft backend too keeps the whole chacha20poly1305 path scalar.
# (sha2's equivalent opt-out is a Cargo `force-soft` feature, injected
# in Cargo.toml rather than here — see that file.)
# Scoped to the UEFI target so the host-test build (`cargo t`, the
# windows-msvc target) keeps its native SIMD backends. #(UEFI build)
[target.x86_64-unknown-uefi]
rustflags = ["--cfg", "poly1305_force_soft", "--cfg", "chacha20_force_soft"]
