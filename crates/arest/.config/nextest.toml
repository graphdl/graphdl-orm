# test-speed-under-30s lever 1: cargo-nextest as the gate runner
# (measured ~3x the libtest run phase: 241 tests in 10.8s vs ~270s
# serial libtest leg). Install: cargo install cargo-nextest.
#
# Gate usage:
#   inner loop : cargo nextest run --features std-deps,local -E 'test(<module>)'
#   full gate  : cargo nextest run --features std-deps,local
#
# The membership perf test asserts a WALL-CLOCK ratio (Set-from-Seq
# beats has_member after Arc<Map>) and flakes under parallel CPU
# contention — the one observed nextest failure (241/1859, 0.177s,
# passes isolated). `threads-required = "num-cpus"` makes the runner
# hold every thread slot for it, so it runs ALONE at its scheduled
# moment instead of forcing the whole suite serial.
[[profile.default.overrides]]
filter = 'test(membership_perf_set_from_seq_beats_has_member_after_arc_map)'
threads-required = "num-cpus"

# Slow-tail visibility: mark tests SLOW at 60s but never terminate —
# the two mandatory_role_alethic_rejection tests legitimately run
# ~325s today (measured 2026-06-12; they dominate the suite's wall
# clock — everything else is done by ~90s, so they ARE the 30s
# target's critical path). They are the shared-metamodel-parse
# lever's primary target; once that lands, tighten this to a
# terminate-after so regressions can't hide.
[profile.default]
slow-timeout = { period = "60s" }

# test-speed-under-30s lever 1b: the `fast` edit-to-signal gate. The FULL suite's
# wall is pinned by a handful of live-compile tests that each re-run a metamodel/
# corpus compile+reflect+validate FROM SCRATCH (measured 2026-06-14 under nextest:
# mandatory_role_alethic_rejection ~213s x2, effective_component_role ~36s,
# derivation_cardinality_count ~30s, valuetype_bridge_join_star ~30s; everything
# else finishes by ~10s). Their inherent cost is the shared-metamodel-compile
# slowness tracked by test-speed-shared-compile-fixture + the 987 family. Until
# that lands, `--profile fast` skips exactly those so the routine confidence gate
# is ~30s instead of ~220s; the inner dev loop stays the filtered form above.
#   fast gate : cargo nextest run --features std-deps,local --profile fast
# Run the DEFAULT (full) profile before commit / in CI. Keep this list in sync
# with the >=29s tests in a fresh `cargo nextest run` timing.
[profile.fast]
default-filter = "not (test(mandatory_role_alethic_rejection) | test(effective_component_role_most_specific_source_wins) | test(derivation_cardinality_count_honors_bound_via_live_compile) | test(valuetype_bridge_join_star_marked_materializes_via_live_compile))"
slow-timeout = { period = "20s" }
