# test-speed-under-30s lever 1: cargo-nextest as the gate runner
# (measured ~3x the libtest run phase: 241 tests in 10.8s vs ~270s
# serial libtest leg). Install: cargo install cargo-nextest.
#
# Gate usage:
#   inner loop : cargo nextest run --features std-deps,local -E 'test(<module>)'
#   full gate  : cargo nextest run --features std-deps,local
#
# The membership perf test asserts a WALL-CLOCK ratio (Set-from-Seq
# beats has_member after Arc<Map>) and flakes under parallel CPU
# contention — the one observed nextest failure (241/1859, 0.177s,
# passes isolated). `threads-required = "num-cpus"` makes the runner
# hold every thread slot for it, so it runs ALONE at its scheduled
# moment instead of forcing the whole suite serial.
[[profile.default.overrides]]
filter = 'test(membership_perf_set_from_seq_beats_has_member_after_arc_map)'
threads-required = "num-cpus"

# Slow-tail visibility: mark tests SLOW at 60s but never terminate.
# HISTORICAL: the mandatory_role_alethic_rejection_tests module ran ~325s
# (2026-06-12) and dominated the suite. a62d8ce8 (MC + value constraints
# O(N*M)->O(N+M) via SetFromSeq/FetchOrPhi) cut the bulk; 4bdc46c8 added the
# single-key SS hash anti-join. MEASURED 2026-06-15 (phase-split probe): of
# that module's 10 tests, 8 are sub-100ms and TWO still dominate —
# format_without_cdt_violates_core_subset_constraint and
# ungrounded_format_violates_totality_subset_constraint, ~17-20s each. Their
# cost is the WHOLE-CORPUS validate (~7-8s/cycle x2 cycles/test), NOT parse
# (~1s) and NOT compile (~1.6s). The remaining validate cost is spread across
# constraint kinds OTHER than the now-hash-joined single-key SS (the SS fix
# moved corpus validate only ~8.6s->7.3s). PROFILED 2026-06-15 (per-constraint
# `constraint:{id}` timing over 995 corpus constraints): MC 4.07s/319 + VC
# 2.80s/41 = 99% of validate; SS now 15.8ms, UC 8.1ms/610, all else <30ms.
# ROOT CAUSE (MEASURED 2026-06-15, sub-Func eval timing — RETRACTS the earlier
# `instances_of_noun_func` claim in this file + commit 1bf3e7e7, which was
# reasoned from the source tree, not measured, and is WRONG): the cost is
# `FetchOrPhi` RE-DERIVING view-marked cells, not instance enumeration.
# Decomposition of the 1.03s outlier "Each Fact Type has some Arity":
#   instances_of_noun_func("Fact Type")            20ms  (2126 inst, 725 distinct) — 2%
#   extract_facts_func("Fact_Type_has_Arity")     828ms  (1391 facts)
#   extract_facts_func("Fact_Type_has_Role")      362us  (1391 facts, SAME count)
# Identical fact count, ~2300x apart. The 81-violation Arity constraint and the
# 81-violation "has some Role" constraint share noun + instances + violation
# count, yet are 1030ms vs 81ms — the whole delta is that one extract. WHY:
# FetchOrPhi (ast.rs:2701) on an index miss falls to resolve_view, which
# EVALUATES the `view:{ft}` def — re-deriving the cell — with NO memoization, so
# every constraint that touches a view-marked / derived cell (Arity, the
# value-typed VC outliers Content Stretch / Pluralization / Change Type)
# re-derives it from scratch. Directly-populated cells hit the O(1) index.
# CONFIRMED 2026-06-15 production-real (not a reflect_then_defs artifact):
# Fact_Type_has_Arity is a MaterializationPolicy::View pure-aggregate rule
# (`Arity iff count of Role where Fact Type has Role`); compile.rs:5040 already
# records "7.2s of pure schema reflection on a population op" for it. The
# existing `aggregate_rule_positive_reads_recover_source_fact_type` test gates
# the FORWARD-CHAIN re-fire (via derivation_reads activation gating) — but
# validate's lazy resolve_view path has NO such gate and re-derives per
# FetchOrPhi access, which is the cost measured here.
# FIX (AREST.tex cost-model: "materialized view, not per-request recomputation";
# a Rust memo cache is OUT — state outside the formula): MATERIALIZE the
# view-marked cells ONCE before the constraints run, into the Selector(4) INDEX
# where extract_facts_func reads (so encoded_pop_lookup hits step-1 and never
# reaches resolve_view) — a pure-algebra augment on the bulk `validate` def,
# same shape as the reverted instances augment, retargeted to the view cells +
# the Selector(4) Map. Careful core-validate change — dedicated effort. NOT yet
# safe to terminate-after.
[profile.default]
slow-timeout = { period = "60s" }

# test-speed-under-30s lever 1b: the `fast` edit-to-signal gate.
# MEASURED 2026-06-15 (cargo test wall, post a62d8ce8 + 4bdc46c8) — the old
# exclusion list is now mostly stale:
#   effective_component_role_most_specific_source_wins         5.4s  (was ~36s)
#   derivation_cardinality_count_honors_bound_via_live_compile 4.2s  (was ~30s)
#   valuetype_bridge_join_star_marked_materializes_via_live..  4.9s  (was ~30s)
# — all three now run in the fast profile (REMOVED from the filter). Only the
# two subset-constraint corpus tests remain slow (~17-20s each: whole-corpus
# validate x2 cycles), so the filter now names EXACTLY those two rather than
# the whole mandatory_role module (whose other 8 tests are sub-100ms). The fast
# profile thus runs those 8 + the 3 ex-excluded tests, staying well under 30s;
# only the 2 genuine slow tests are skipped for edit-to-signal.
# NEXT (to converge fast==full): the 2 slow tests are dominated by FetchOrPhi
# re-deriving view-marked cells per constraint access (see the measured root
# cause in the [profile.default] note above) — NOT instance enumeration, NOT SS.
# Materializing those view cells ONCE into the validate population should cut
# corpus validate ~7s->~1-2s and likely retire this filter entirely.
#   fast gate : cargo nextest run --features std-deps,local --profile fast
[profile.fast]
default-filter = "not (test(format_without_cdt_violates_core_subset_constraint) | test(ungrounded_format_violates_totality_subset_constraint))"
slow-timeout = { period = "20s" }
